<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>شفرة بء - بؤ - بق</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f3f3f3;
            color: #222;
            font-family: Arial, Tahoma, sans-serif;
        }

        .page {
            width: 90%;
            max-width: 750px;
            margin: 45px auto;
        }

        header {
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: normal;
        }

        header p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .box {
            background: white;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 6px;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #ddd;
            margin-bottom: 20px;
        }

        .tab {
            background: none;
            border: none;
            padding: 10px 18px;
            cursor: pointer;
            color: #777;
            font-size: 15px;
        }

        .tab.active {
            color: #222;
            border-bottom: 2px solid #333;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            min-height: 160px;
            resize: vertical;

            border: 1px solid #ccc;
            border-radius: 4px;

            padding: 12px;
            font-family: Arial, Tahoma, sans-serif;
            font-size: 15px;

            outline: none;
        }

        textarea:focus {
            border-color: #888;
        }

        .run {
            margin-top: 12px;
            padding: 10px 20px;

            background: #333;
            color: white;

            border: none;
            border-radius: 4px;

            cursor: pointer;
            font-size: 14px;
        }

        .run:hover {
            background: #222;
        }

        .result {
            margin-top: 25px;
        }

        .result-title {
            font-size: 14px;
            margin-bottom: 8px;
        }

        #output {
            min-height: 100px;

            background: #f7f7f7;
            border: 1px solid #ddd;
            border-radius: 4px;

            padding: 12px;

            white-space: pre-wrap;
            word-break: break-word;

            font-size: 15px;
            line-height: 1.8;
        }

        .copy {
            margin-top: 8px;

            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;

            padding: 8px 15px;

            cursor: pointer;
        }

        .copy:hover {
            background: #f1f1f1;
        }

        footer {
            margin-top: 18px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .page {
                width: 94%;
                margin: 25px auto;
            }

            .box {
                padding: 15px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header>
        <h1>شفرة بء - بؤ - بق</h1>
        <p>أداة بسيطة لتشفير وفك تشفير النصوص</p>
    </header>

    <div class="box">

        <div class="tabs">

            <button
                id="encodeTab"
                class="tab active"
                onclick="changeMode('encode')">
                تشفير
            </button>

            <button
                id="decodeTab"
                class="tab"
                onclick="changeMode('decode')">
                فك التشفير
            </button>

        </div>

        <label id="inputLabel">النص</label>

        <textarea
            id="input"
            placeholder="اكتب النص هنا..."
        ></textarea>

        <button class="run" onclick="run()">
            تنفيذ
        </button>

        <div class="result">

            <div class="result-title">
                النتيجة
            </div>

            <div id="output"></div>

            <button class="copy" onclick="copyResult()">
                نسخ
            </button>

        </div>

    </div>

    <footer>
        شفرة بء - بؤ - بق
    </footer>

</div>


<script>

const CIPHER_MAP = {
    'ا': 'بءبء',
    'ب': 'بءبؤ',
    'پ': 'بقبءبق',
    'ت': 'بءبق',
    'ة': 'بقبؤبق',
    'ث': 'بؤبء',
    'ج': 'بؤبؤ',
    'چ': 'بقبءبؤ',
    'ح': 'بؤبق',
    'خ': 'بقبء',
    'د': 'بقبؤ',
    'ذ': 'بقبق',
    'ر': 'بءبءبء',
    'ز': 'بءبءبؤ',
    'س': 'بءبءبق',
    'ش': 'بءبؤبء',
    'ص': 'بءبؤبؤ',
    'ض': 'بءبؤبق',
    'ط': 'بءبقبء',
    'ظ': 'بءبقبؤ',
    'ع': 'بءبقبق',
    'غ': 'بؤبءبء',
    'ف': 'بؤبءبؤ',
    'ڤ': 'بقبؤبؤ',
    'ق': 'بؤبءبق',
    'ك': 'بؤبؤبء',
    'گ': 'بقبؤبء',
    'ل': 'بؤبؤبؤ',
    'م': 'بؤبؤبق',
    'ن': 'بؤبقبء',
    'ه': 'بؤبقبؤ',
    'و': 'بؤبقبق',
    'ي': 'بقبءبء',

    ' ': '/',

    '0': 'بقبقبءبء',
    '1': 'بقبقبءبؤ',
    '2': 'بقبقبءبق',
    '3': 'بقبقبؤبء',
    '4': 'بقبقبؤبؤ',
    '5': 'بقبقبؤبق',
    '6': 'بقبقبقبء',
    '7': 'بقبقبقبؤ',
    '8': 'بقبقبقبق',
    '9': 'بقبؤبءبء',

    'َ': 'بؤبؤبءبء',
    'ُ': 'بؤبؤبءبؤ',
    'ِ': 'بؤبؤبءبق',
    'ْ': 'بؤبؤبؤبء',
    'ّ': 'بؤبؤبؤبؤ',
    'ً': 'بؤبؤبؤبق',
    '؟': 'بؤبؤبقبء',
    '.': 'بؤبؤبقبؤ',
    '،': 'بؤبؤبقبق'
};

const DECODE_MAP = {};

for (let key in CIPHER_MAP) {
    DECODE_MAP[CIPHER_MAP[key]] = key;
}

let mode = 'encode';


function changeMode(newMode) {

    mode = newMode;

    document
        .getElementById('encodeTab')
        .classList.toggle('active', mode === 'encode');

    document
        .getElementById('decodeTab')
        .classList.toggle('active', mode === 'decode');

    document.getElementById('output').textContent = '';

    if (mode === 'encode') {

        document.getElementById('inputLabel').textContent = 'النص';

        document.getElementById('input').placeholder =
            'اكتب النص الذي تريد تشفيره...';

    } else {

        document.getElementById('inputLabel').textContent =
            'النص المشفر';

        document.getElementById('input').placeholder =
            'أدخل الشفرة هنا...';
    }
}


function encode(text) {

    return [...text]
        .map(char => CIPHER_MAP[char] ?? char)
        .join(' ');
}


function decode(text) {

    const tokens = text.trim().split(/\s+/);

    return tokens
        .map(token => DECODE_MAP[token] ?? token)
        .join('');
}


function run() {

    const input = document.getElementById('input').value;
    const output = document.getElementById('output');

    if (!input.trim()) {
        output.textContent = 'لم يتم إدخال أي نص.';
        return;
    }

    if (mode === 'encode') {
        output.textContent = encode(input);
    } else {
        output.textContent = decode(input);
    }
}


function copyResult() {

    const result = document.getElementById('output').textContent;

    if (!result) {
        return;
    }

    navigator.clipboard.writeText(result);

    const button = document.querySelector('.copy');

    button.textContent = 'تم النسخ';

    setTimeout(function () {
        button.textContent = 'نسخ';
    }, 1200);
}

</script>

</body>
</html>
